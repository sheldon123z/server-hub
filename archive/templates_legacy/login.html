<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - ServerHub</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── Variables ─── */
:root {
  --bg-a: #0c1222;
  --bg-b: #162036;
  --card-bg: rgba(15, 23, 42, 0.75);
  --border-glass: rgba(56, 189, 248, 0.12);
  --accent: #38bdf8;
  --accent-purple: #a78bfa;
  --green: #4ade80;
  --text-1: #f1f5f9;
  --text-2: #94a3b8;
  --text-3: #475569;
  --t-fast: 150ms ease;
  --t-smooth: 300ms cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 50%, #0f1a2e 100%);
  color: var(--text-1);
  min-height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ─── Ambient Glow Orbs ─── */
.glow-orb {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(80px);
  z-index: 0;
}

.glow-orb-1 {
  width: 500px; height: 500px;
  background: rgba(56, 189, 248, 0.07);
  top: -10%; right: -5%;
  animation: breathe 8s ease-in-out infinite;
}

.glow-orb-2 {
  width: 400px; height: 400px;
  background: rgba(167, 139, 250, 0.06);
  bottom: -10%; left: -5%;
  animation: breathe 10s ease-in-out 2s infinite;
}

/* ─── SVG Grid Background ─── */
.grid-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  opacity: 0.4;
}

/* ─── Waveform Lines ─── */
.waveform-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.waveform-container svg {
  position: absolute;
  width: 120%;
  left: -10%;
}

.wave-line {
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
}

.wave-1 {
  stroke: rgba(56, 189, 248, 0.12);
  stroke-dasharray: 8 12;
  animation: waveDrift 12s linear infinite;
}

.wave-2 {
  stroke: rgba(167, 139, 250, 0.08);
  stroke-dasharray: 6 16;
  animation: waveDrift 16s linear infinite reverse;
}

.wave-3 {
  stroke: rgba(74, 222, 128, 0.06);
  stroke-dasharray: 10 14;
  animation: waveDrift 20s linear infinite;
}

/* ─── Canvas Particles ─── */
#particle-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 2;
}

/* ─── Mouse Glow ─── */
.mouse-glow {
  position: fixed;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(56, 189, 248, 0.05) 0%, transparent 70%);
  pointer-events: none;
  z-index: 3;
  transform: translate(-50%, -50%);
  transition: left 0.4s ease-out, top 0.4s ease-out;
}

/* ─── Login Container ─── */
.login-container {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

/* ─── Login Card ─── */
.login-card {
  width: 380px;
  max-width: 92vw;
  background: var(--card-bg);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  border: 1px solid var(--border-glass);
  border-radius: 16px;
  padding: 36px 32px 32px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  opacity: 0;
  transform: translateY(16px);
  animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
}

/* ─── Server Icon ─── */
.server-icon {
  width: 44px; height: 44px;
  margin: 0 auto 16px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(167, 139, 250, 0.08));
  border: 1px solid rgba(56, 189, 248, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
}

.server-icon svg {
  width: 22px; height: 22px;
  color: var(--accent);
}

/* ─── Title ─── */
.login-title {
  text-align: center;
  margin-bottom: 4px;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.login-subtitle {
  text-align: center;
  color: var(--text-3);
  font-size: 13px;
  margin-bottom: 28px;
}

.login-subtitle code {
  color: var(--text-2);
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 12px;
  background: rgba(255,255,255,0.04);
  padding: 1px 5px;
  border-radius: 4px;
}

/* ─── Error ─── */
.login-error {
  background: rgba(248, 113, 113, 0.08);
  border: 1px solid rgba(248, 113, 113, 0.2);
  color: #fca5a5;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 12px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: shakeIn 0.35s ease;
}

.login-error svg { width: 16px; height: 16px; flex-shrink: 0; color: #f87171; }

/* ─── Form ─── */
.input-group {
  position: relative;
  margin-bottom: 14px;
}

.input-group label {
  display: block;
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-3);
  margin-bottom: 5px;
  transition: color var(--t-fast);
}

.input-group:focus-within label { color: var(--accent); }

.input-icon {
  position: absolute;
  left: 12px; bottom: 11px;
  width: 16px; height: 16px;
  color: var(--text-3);
  pointer-events: none;
  transition: color var(--t-fast);
}

.input-group:focus-within .input-icon { color: var(--accent); }

.form-input {
  width: 100%;
  padding: 10px 12px 10px 38px;
  background: rgba(15, 23, 42, 0.5);
  border: 1px solid rgba(51, 65, 85, 0.5);
  border-radius: 10px;
  color: var(--text-1);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: all var(--t-smooth);
}

.form-input::placeholder { color: var(--text-3); font-size: 13px; }
.form-input:hover { border-color: rgba(56, 189, 248, 0.2); }
.form-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.08);
}

/* ─── Button ─── */
.btn-login {
  width: 100%;
  padding: 11px 24px;
  margin-top: 6px;
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.85), rgba(99, 155, 255, 0.85));
  border: none;
  border-radius: 10px;
  color: #0f172a;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  outline: none;
  position: relative;
  overflow: hidden;
  transition: all var(--t-smooth);
}

.btn-login::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  transition: left 0.5s ease;
}

.btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.2); }
.btn-login:hover::before { left: 100%; }
.btn-login:active { transform: translateY(0); }
.btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.btn-login .btn-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  z-index: 1;
}

.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(15, 23, 42, 0.3);
  border-top-color: #0f172a;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

/* ─── Footer ─── */
.login-footer {
  text-align: center;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid rgba(51, 65, 85, 0.25);
  font-size: 11px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.login-footer svg { width: 12px; height: 12px; opacity: 0.5; }

/* ─── Bottom Bar ─── */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 10;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-3);
  background: linear-gradient(to top, rgba(12, 18, 34, 0.7), transparent);
  opacity: 0;
  animation: fadeUp 0.4s ease 1s forwards;
}

.tech-stack {
  display: flex;
  gap: 16px;
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 10px;
}

.tech-stack span { opacity: 0.4; transition: opacity var(--t-fast); }
.tech-stack span:hover { opacity: 0.8; }

/* ─── Keyframes ─── */
@keyframes cardIn {
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes breathe {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(1.05); }
}

@keyframes waveDrift {
  from { stroke-dashoffset: 0; }
  to { stroke-dashoffset: -200; }
}

@keyframes spin { to { transform: rotate(360deg); } }

@keyframes shakeIn {
  0% { transform: translateX(-8px); opacity: 0; }
  40% { transform: translateX(4px); }
  70% { transform: translateX(-2px); }
  100% { transform: translateX(0); opacity: 1; }
}

/* ─── Reduced Motion ─── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .login-card { opacity: 1; transform: none; }
  .bottom-bar { opacity: 1; }
  .glow-orb { animation: none; }
}

/* ─── Responsive ─── */
@media (max-width: 768px) {
  .waveform-container { display: none; }
  .bottom-bar .tech-stack { display: none; }
  .login-card { padding: 28px 24px 24px; }
  .glow-orb-1 { width: 300px; height: 300px; }
  .glow-orb-2 { width: 250px; height: 250px; }
}
</style>
</head>
<body x-data="loginApp()" @mousemove.throttle.50ms="mouseX=$event.clientX;mouseY=$event.clientY">

<!-- Ambient Glow Orbs -->
<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>

<!-- SVG Perspective Grid -->
<svg class="grid-bg" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(56,189,248,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
</svg>

<!-- Abstract Waveform Lines -->
<div class="waveform-container">
  <svg viewBox="0 0 1200 200" preserveAspectRatio="none" style="top:15%;height:200px">
    <path class="wave-line wave-1" d="M0,100 C150,60 300,140 450,100 C600,60 750,140 900,100 C1050,60 1200,140 1350,100"/>
    <path class="wave-line wave-2" d="M0,120 C200,80 400,160 600,120 C800,80 1000,160 1200,120"/>
  </svg>
  <svg viewBox="0 0 1200 200" preserveAspectRatio="none" style="bottom:20%;height:180px">
    <path class="wave-line wave-3" d="M0,90 C180,130 360,50 540,90 C720,130 900,50 1080,90 C1260,130 1440,50 1620,90"/>
  </svg>
</div>

<!-- Particle Network -->
<canvas id="particle-canvas"></canvas>

<!-- Mouse Follow Glow -->
<div class="mouse-glow" :style="`left:${mouseX}px;top:${mouseY}px`"></div>

<!-- Login Card -->
<div class="login-container">
  <div class="login-card">
    <!-- Server Icon -->
    <div class="server-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
        <line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>
      </svg>
    </div>

    <h1 class="login-title">ServerHub</h1>
    <p class="login-subtitle"><code>NF5468M6</code> &middot; 服务器管理系统</p>

    <!-- Error -->
    <template x-if="error">
      <div class="login-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span x-text="error"></span>
      </div>
    </template>

    <!-- Form -->
    <form @submit.prevent="handleLogin">
      <div class="input-group">
        <label for="username">用户名</label>
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input id="username" x-ref="username" type="text" class="form-input" placeholder="请输入用户名" autocomplete="username" required autofocus>
      </div>
      <div class="input-group">
        <label for="password">密码</label>
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="password" x-ref="password" type="password" class="form-input" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" :disabled="loading">
        <span class="btn-content">
          <template x-if="loading"><span class="spinner"></span></template>
          <span x-text="loading ? '验证中...' : '登 录'"></span>
        </span>
      </button>
    </form>

    <div class="login-footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      HTTPS + JWT Cookie 安全认证
    </div>
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <span>ServerHub v1.0</span>
  <div class="tech-stack">
    <span>FastAPI</span>
    <span>HTMX</span>
    <span>Alpine.js</span>
  </div>
</div>

<script src="/static/js/alpine.min.js" defer></script>
<script>
function loginApp() {
  return {
    error: '',
    loading: false,
    mouseX: -300,
    mouseY: -300,

    async handleLogin() {
      this.loading = true;
      this.error = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: this.$refs.username.value,
            password: this.$refs.password.value,
          }),
        });
        const data = await res.json();
        if (res.ok) {
          document.querySelector('.login-card').style.animation = 'cardIn 0.4s ease reverse forwards';
          setTimeout(() => { window.location.href = '/'; }, 350);
        } else {
          this.error = data.detail || '登录失败';
        }
      } catch {
        this.error = '网络连接失败，请检查网络';
      } finally {
        this.loading = false;
      }
    },
  };
}

/* ─── Particle Network ─── */
(function() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles;
  const COUNT = 40;
  const MAX_DIST = 180;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function init() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    particles = [];
    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        r: Math.random() * 2 + 2,
        o: Math.random() * 0.4 + 0.15,
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    if (reduced) {
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56, 189, 248, ${p.o * 0.4})`;
        ctx.fill();
      });
      return;
    }

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
    });

    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MAX_DIST) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(56, 189, 248, ${(1 - dist / MAX_DIST) * 0.2})`;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
      ctx.beginPath();
      ctx.arc(particles[i].x, particles[i].y, particles[i].r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(56, 189, 248, ${particles[i].o})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', init);
  init();
  if (reduced) { draw(); } else { requestAnimationFrame(draw); }
})();
</script>
</body>
</html>
