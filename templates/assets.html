{% extends "base.html" %}
{% block title %}资产台账{% endblock %}
{% block page_title %}资产台账{% endblock %}

{% block content %}
<style>
.assets-layout { display: flex; flex-direction: column; gap: 14px; }
.asset-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.asset-stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
.asset-stat-card .stat-num { font-size: 28px; font-weight: 700; color: var(--accent); }
.asset-stat-card .stat-label { font-size: 12px; color: var(--text2); margin-top: 2px; }
.asset-stat-card .stat-sub { font-size: 10px; color: var(--text3); }

.asset-main { display: grid; grid-template-columns: 260px 1fr; gap: 10px; min-height: 500px; }
.asset-list-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
.asset-list-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.asset-list-header h3 { font-size: 14px; margin: 0; }
.asset-list { flex: 1; overflow-y: auto; padding: 6px; }
.asset-type-group { margin-bottom: 8px; }
.asset-type-label { padding: 4px 10px; font-size: 10px; text-transform: uppercase; color: var(--text3); font-weight: 600; letter-spacing: 0.5px; }
.asset-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: background 0.12s; }
.asset-item:hover { background: rgba(56,189,248,0.04); }
.asset-item.active { background: var(--accent-dim); }
.asset-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.asset-dot.running, .asset-dot.ok, .asset-dot.listening { background: var(--green); }
.asset-dot.stopped { background: var(--red); }
.asset-dot.warning { background: var(--yellow); }
.asset-dot.unknown { background: var(--text3); }
.asset-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.asset-detail-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
.asset-detail-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.asset-detail-tab { padding: 8px 16px; font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text2); }
.asset-detail-tab:hover { color: var(--text); }
.asset-detail-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.asset-detail-content { flex: 1; overflow-y: auto; padding: 16px; }
.asset-props-table { width: 100%; font-size: 12px; border-collapse: collapse; }
.asset-props-table th, .asset-props-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; }
.asset-props-table th { color: var(--text2); font-weight: 500; width: 120px; }
.asset-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text3); gap: 8px; }

.topo-container { flex: 1; overflow: auto; padding: 16px; min-height: 300px; }
.topo-container .mermaid { display: flex; justify-content: center; }
</style>

<div class="assets-layout" x-data="assetsApp()" x-init="init()">

  <!-- 统计卡片 -->
  <div class="asset-stats">
    <template x-for="(info, type) in summary" :key="type">
      <div class="asset-stat-card">
        <div class="stat-num" x-text="info.total"></div>
        <div class="stat-label" x-text="typeNames[type]||type"></div>
        <div class="stat-sub" x-text="info.healthy+'/'+info.total+' 正常'"></div>
      </div>
    </template>
    <div class="asset-stat-card" style="display:flex;align-items:center;justify-content:center">
      <button class="btn btn-primary btn-sm" @click="discover()" :disabled="discovering">
        <span x-show="!discovering">发现资产</span>
        <span x-show="discovering">发现中...</span>
      </button>
    </div>
  </div>

  <!-- 主体: 列表 + 详情 -->
  <div class="asset-main">
    <!-- 左: 资产列表 -->
    <div class="asset-list-panel">
      <div class="asset-list-header">
        <h3>资产列表 <span class="text-xs text-muted" x-text="'('+assets.length+')'"></span></h3>
        <select style="background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:2px 6px;font-size:11px"
                x-model="filterType" @change="loadAssets()">
          <option value="">全部</option>
          <option value="service">服务</option>
          <option value="container">容器</option>
          <option value="compose">堆栈</option>
          <option value="port">端口</option>
          <option value="storage">存储</option>
        </select>
      </div>
      <div class="asset-list">
        <template x-for="type in orderedTypes" :key="'g-'+type">
          <div class="asset-type-group" x-show="filteredAssets(type).length > 0">
            <div class="asset-type-label" x-text="typeNames[type]||type"></div>
            <template x-for="a in filteredAssets(type)" :key="a.id">
              <div class="asset-item" :class="activeAsset===a.id?'active':''" @click="activeAsset=a.id">
                <div class="asset-dot" :class="a.status"></div>
                <div class="asset-name" x-text="a.name"></div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>

    <!-- 右: 详情 + 拓扑 -->
    <div class="asset-detail-panel">
      <div class="asset-detail-tabs">
        <div class="asset-detail-tab" :class="detailTab==='info'?'active':''" @click="detailTab='info'">资产详情</div>
        <div class="asset-detail-tab" :class="detailTab==='topo'?'active':''" @click="loadTopology(); detailTab='topo'">拓扑图</div>
      </div>

      <!-- 详情 -->
      <div class="asset-detail-content" x-show="detailTab==='info'">
        <template x-if="activeAsset && currentAsset">
          <div>
            <h3 style="font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px">
              <div class="asset-dot" :class="currentAsset.status" style="width:10px;height:10px"></div>
              <span x-text="currentAsset.name"></span>
              <span class="badge badge-info" x-text="typeNames[currentAsset.type]||currentAsset.type" style="font-size:10px"></span>
            </h3>
            <table class="asset-props-table">
              <tr><th>ID</th><td style="font-family:monospace;font-size:11px" x-text="currentAsset.id"></td></tr>
              <tr><th>状态</th><td x-text="currentAsset.status"></td></tr>
              <tr><th>来源</th><td x-text="currentAsset.is_manual?'手动录入':'自动发现'"></td></tr>
              <tr><th>最后发现</th><td x-text="(currentAsset.last_seen||'').replace('T',' ').slice(0,19)"></td></tr>
              <template x-for="(val, key) in (currentAsset.properties||{})" :key="key">
                <tr><th x-text="key"></th><td x-text="typeof val==='object'?JSON.stringify(val):val"></td></tr>
              </template>
            </table>
            <div x-show="currentAsset.dependencies && currentAsset.dependencies.length" style="margin-top:12px">
              <h4 style="font-size:12px;color:var(--text2);margin:0 0 6px">依赖关系</h4>
              <div style="display:flex;gap:4px;flex-wrap:wrap">
                <template x-for="dep in (currentAsset.dependencies||[])" :key="dep">
                  <span class="badge badge-info" x-text="dep" style="font-size:10px;cursor:pointer" @click="activeAsset=dep"></span>
                </template>
              </div>
            </div>
          </div>
        </template>
        <div x-show="!activeAsset" class="asset-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
          <span style="font-size:13px">选择一个资产查看详情</span>
        </div>
      </div>

      <!-- 拓扑图 -->
      <div class="topo-container" x-show="detailTab==='topo'">
        <div x-show="!topoMermaid" class="asset-empty">
          <span style="font-size:13px">加载中...</span>
        </div>
        <div class="mermaid" x-show="topoMermaid" x-ref="topoChart"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"
        onerror="document.getElementById('mermaid-fallback')&&(document.getElementById('mermaid-fallback').style.display='block')"></script>
<div id="mermaid-fallback" style="display:none;text-align:center;padding:20px;color:var(--text3);font-size:12px">
  Mermaid.js 加载失败（CDN 不可用），拓扑图无法渲染。<br>可尝试刷新页面或检查网络连接。
</div>
<script>
if (typeof mermaid !== 'undefined') {
  mermaid.initialize({ startOnLoad: false, theme: 'dark', themeVariables: { primaryColor: '#1e293b', primaryBorderColor: '#38bdf8', lineColor: '#475569' }});
}

function assetsApp() {
  return {
    assets: [], summary: {}, activeAsset: '', filterType: '', detailTab: 'info',
    discovering: false, topoMermaid: '',
    typeNames: { service: '系统服务', container: 'Docker容器', compose: 'Compose堆栈', port: '监听端口', storage: '存储挂载' },
    orderedTypes: ['compose', 'service', 'container', 'port', 'storage'],

    get currentAsset() { return this.assets.find(a => a.id === this.activeAsset) || null; },

    filteredAssets(type) {
      return this.assets.filter(a => a.type === type);
    },

    async init() {
      await this.loadSummary();
      await this.loadAssets();
    },

    async loadAssets() {
      try {
        const url = this.filterType ? `/api/assets/?type=${this.filterType}` : '/api/assets/';
        this.assets = await (await fetch(url)).json();
      } catch(e) {}
    },

    async loadSummary() {
      try { this.summary = await (await fetch('/api/assets/summary')).json(); } catch(e) {}
    },

    async discover() {
      this.discovering = true;
      try {
        const d = await (await fetch('/api/assets/discover', {method:'POST'})).json();
        if (d.ok) {
          showToast(`发现 ${d.total} 项资产`, 'ok');
          await this.loadAssets();
          await this.loadSummary();
        }
      } catch(e) { showToast('发现失败', 'err'); }
      this.discovering = false;
    },

    async loadTopology() {
      if (typeof mermaid === 'undefined') { return; }
      try {
        const d = await (await fetch('/api/assets/topology')).json();
        this.topoMermaid = d.mermaid || '';
        if (this.topoMermaid) {
          this.$nextTick(async () => {
            const el = this.$refs.topoChart;
            if (el) {
              try {
                const { svg } = await mermaid.render('topo-svg-' + Date.now(), this.topoMermaid);
                el.innerHTML = svg;
              } catch(renderErr) {
                el.innerHTML = '<pre style="color:var(--text3);font-size:11px">' + this.topoMermaid + '</pre>';
              }
            }
          });
        }
      } catch(e) {}
    },
  };
}
</script>
{% endblock %}
