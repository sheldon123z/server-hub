{% extends "base.html" %}
{% block title %}仪表盘{% endblock %}
{% block page_title %}监控大屏{% endblock %}

{% block top_actions %}
<button class="btn btn-sm" @click="openLocate('alerts')">告警历史</button>
<button class="btn btn-sm" @click="openLocate('processes', {sort:'cpu'})">进程排行</button>
{% endblock %}

{% block content %}
<div id="dashboard-page" x-data="dashboardState()" x-init="init()">

<template x-if="!drillTarget">
<div>
  <div class="alert-bar">
    <span class="alert-badge alert-badge-critical" x-show="alerts.critical > 0">
      严重 <span x-text="alerts.critical"></span>
    </span>
    <span class="alert-badge alert-badge-warning" x-show="alerts.warning > 0">
      警告 <span x-text="alerts.warning"></span>
    </span>
    <span class="alert-badge alert-badge-ok" x-show="alerts.critical === 0 && alerts.warning === 0">
      系统正常
    </span>
    <span class="badge badge-info" x-text="'告警规则 ' + (alerts.activeRules || 0)"></span>
    <span class="ws-indicator" :class="wsConnected ? 'connected' : 'disconnected'">
      <span class="ws-dot"></span>
      <span x-text="wsConnected ? '实时' : '断连'" style="font-size:12px"></span>
    </span>
  </div>

  <div class="stats-grid-enhanced">
    <div class="stat-card-enhanced" @click="drillTo('system')">
      <div class="stat-card-header"><span>主机状态</span></div>
      <div class="stat-card-value" style="color: var(--green)">运行中</div>
      <div class="stat-card-sub" x-text="systemInfo.hostname || '加载中...'"></div>
      <div class="sparkline-container" id="sparkLoad"></div>
    </div>

    <div class="stat-card-enhanced" @click="drillTo('cpu')">
      <div class="stat-card-header"><span>CPU</span></div>
      <div class="stat-card-value" :style="{color: statusColor(cpu.overall_percent)}" x-text="formatPercentM(cpu.overall_percent)"></div>
      <div class="stat-card-sub" x-text="cpu.count + '核 | 负载 ' + formatNumber(loadValue('1min'))"></div>
      <div class="sparkline-container" id="sparkCpu"></div>
    </div>

    <div class="stat-card-enhanced" @click="drillTo('memory')">
      <div class="stat-card-header"><span>内存</span></div>
      <div class="stat-card-value" :style="{color: statusColor(memoryPercent())}" x-text="formatPercentM(memoryPercent())"></div>
      <div class="stat-card-sub" x-text="formatBytesM(memoryUsed()) + ' / ' + formatBytesM(memoryTotal())"></div>
      <div class="sparkline-container" id="sparkMem"></div>
    </div>

    <div class="stat-card-enhanced" @click="drillTo('memory')">
      <div class="stat-card-header"><span>Swap</span></div>
      <div class="stat-card-value" :style="{color: statusColor(swapPercent())}" x-text="formatPercentM(swapPercent())"></div>
      <div class="stat-card-sub" x-text="formatBytesM(swapUsed()) + ' / ' + formatBytesM(swapTotal())"></div>
      <div class="sparkline-container" id="sparkSwap"></div>
    </div>

    <div class="stat-card-enhanced" @click="drillTo('disk')">
      <div class="stat-card-header"><span>根分区</span></div>
      <div class="stat-card-value" :style="{color: statusColor(primaryDiskPercent())}" x-text="formatPercentM(primaryDiskPercent())"></div>
      <div class="stat-card-sub" x-text="primaryDiskLabel()"></div>
      <div class="sparkline-container" id="sparkDisk"></div>
    </div>

    <div class="stat-card-enhanced" @click="drillTo('network')">
      <div class="stat-card-header"><span>网络吞吐</span></div>
      <div class="stat-card-value" style="font-size:18px">
        <span style="color:#38bdf8" x-text="'↓ ' + formatRate(netIn())"></span>
      </div>
      <div class="stat-card-sub" x-text="'↑ ' + formatRate(netOut()) + ' | TCP ' + (network.tcp_total || 0)"></div>
      <div class="sparkline-container" id="sparkNet"></div>
    </div>

    <div class="stat-card-enhanced" @click="drillTo('disk')">
      <div class="stat-card-header"><span>磁盘 I/O</span></div>
      <div class="stat-card-value" :style="{color: statusColor(busiestDeviceUtil())}" x-text="formatPercentM(busiestDeviceUtil())"></div>
      <div class="stat-card-sub" x-text="busiestDeviceName()"></div>
      <div class="sparkline-container" id="sparkIo"></div>
    </div>

    <div class="stat-card-enhanced" @click="drillTo('docker')">
      <div class="stat-card-header"><span>Docker</span></div>
      <div class="stat-card-value" :style="{color: dockerAbnormalCount() > 0 ? '#fbbf24' : '#4ade80'}" x-text="docker.total_running + '/' + docker.total_containers"></div>
      <div class="stat-card-sub" x-text="dockerAbnormalCount() > 0 ? (dockerAbnormalCount() + ' 个异常容器') : '容器状态健康'"></div>
      <div class="sparkline-container" id="sparkDocker"></div>
    </div>

    <div class="stat-card-enhanced stat-card-wide" @click="drillTo('gpu')">
      <div class="stat-card-header"><span x-text="gpu.name || 'GPU'"></span></div>
      <div style="display:flex;gap:20px;align-items:flex-end">
        <div>
          <div class="stat-card-label">利用率</div>
          <div class="stat-card-value" :style="{color: statusColor(gpu.util || 0)}" x-text="formatPercentM(gpu.util || 0)"></div>
        </div>
        <div>
          <div class="stat-card-label">显存</div>
          <div class="stat-card-value" style="font-size:18px" x-text="gpu.mem_total ? (gpu.mem_used + ' / ' + gpu.mem_total + ' MB') : '未检测到'"></div>
        </div>
        <div>
          <div class="stat-card-label">温度</div>
          <div class="stat-card-value" style="font-size:18px" :style="{color: gpuTempColor()}" x-text="gpu.temp ? (gpu.temp + ' C') : '-'"></div>
        </div>
      </div>
      <div class="sparkline-container" id="sparkGpu"></div>
    </div>
  </div>

  <div class="dashboard-overview-grid">
    <div class="chart-card dashboard-span-8">
      <div class="chart-card-header">
        <div>
          <h3>系统资源趋势</h3>
          <div class="dashboard-chart-note">CPU / RAM / GPU / Swap</div>
        </div>
        <div class="toolbar-pills">
          <button class="btn btn-xs" :class="historyPeriod === '1' ? 'btn-primary' : ''" @click="setHistoryPeriod('1')">1h</button>
          <button class="btn btn-xs" :class="historyPeriod === '6' ? 'btn-primary' : ''" @click="setHistoryPeriod('6')">6h</button>
          <button class="btn btn-xs" :class="historyPeriod === '24' ? 'btn-primary' : ''" @click="setHistoryPeriod('24')">24h</button>
          <button class="btn btn-xs" :class="historyPeriod === '72' ? 'btn-primary' : ''" @click="setHistoryPeriod('72')">3d</button>
        </div>
      </div>
      <div id="overview-trend" class="chart-box-xl"></div>
    </div>

    <div class="dashboard-span-4 dashboard-stack-grid">
      <div class="chart-card">
        <div class="chart-card-header">
          <h3>告警分布</h3>
          <span class="badge badge-info" x-text="'24h ' + (alerts.total24h || 0)"></span>
        </div>
        <div id="overview-alerts-donut" class="chart-box-sm"></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-header">
          <h3>容器健康度</h3>
          <span class="badge badge-info" x-text="docker.total_containers + ' 个容器'"></span>
        </div>
        <div id="overview-docker-donut" class="chart-box-sm"></div>
      </div>
    </div>

    <div class="chart-card dashboard-span-4">
      <div class="chart-card-header">
        <h3>网络吞吐趋势</h3>
        <span class="dashboard-chart-note">上行 / 下行</span>
      </div>
      <div id="overview-network-trend" class="chart-box-md"></div>
    </div>

    <div class="chart-card dashboard-span-4">
      <div class="chart-card-header">
        <h3>磁盘与挂载点压力</h3>
        <span class="dashboard-chart-note">Top 使用率</span>
      </div>
      <div id="overview-disk-usage" class="chart-box-md"></div>
    </div>

    <div class="chart-card dashboard-span-4">
      <div class="chart-card-header">
        <h3>高负载进程</h3>
        <span class="dashboard-chart-note">CPU Top 8</span>
      </div>
      <div id="overview-top-proc" class="chart-box-md"></div>
    </div>

    <div class="chart-card dashboard-span-6">
      <div class="chart-card-header">
        <h3>容器组资源占用</h3>
        <span class="dashboard-chart-note">CPU / Memory</span>
      </div>
      <div id="overview-docker-groups" class="chart-box-md"></div>
    </div>

    <div class="chart-card dashboard-span-6">
      <div class="chart-card-header">
        <h3>当前资源结构</h3>
        <span class="dashboard-chart-note">CPU / Memory / Disk / GPU</span>
      </div>
      <div id="overview-resource-mix" class="chart-box-md"></div>
    </div>

    <div class="chart-card dashboard-span-12">
      <div class="chart-card-header">
        <h3>最近告警</h3>
        <button class="btn btn-xs" @click="openLocate('alerts')">查看全部</button>
      </div>
      <ul class="recent-alert-list">
        <template x-for="(a, idx) in alerts.recent.slice(0, 6)" :key="idx">
          <li class="recent-alert-item">
            <span class="text-xs text-muted" x-text="formatAlertTime(a)"></span>
            <span class="alert-severity"
                  :class="a.severity === 'critical' ? 'alert-badge-critical' : a.severity === 'warning' ? 'alert-badge-warning' : 'alert-badge-ok'"
                  x-text="a.severity || 'info'"></span>
            <span class="alert-msg" x-text="a.message || a.msg || '-'"></span>
          </li>
        </template>
        <template x-if="alerts.recent.length === 0">
          <li class="text-xs text-muted">暂无告警记录</li>
        </template>
      </ul>
    </div>
  </div>
</div>
</template>

<template x-if="drillTarget === 'cpu'">
<div class="detail-panel" x-transition>
  <div class="detail-header">
    <button class="back-btn" @click="backToOverview()">← 返回</button>
    <h2>CPU 详情</h2>
    <span class="text-xs text-muted" x-text="cpu.count + ' 逻辑核心'"></span>
  </div>

  <div class="stat-strip">
    <div class="compact-stat">
      <div class="compact-stat-label">当前利用率</div>
      <div class="compact-stat-value" :style="{color: statusColor(cpu.overall_percent)}" x-text="formatPercentM(cpu.overall_percent)"></div>
    </div>
    <div class="compact-stat">
      <div class="compact-stat-label">1 分钟负载</div>
      <div class="compact-stat-value" x-text="formatNumber(loadValue('1min'))"></div>
    </div>
    <div class="compact-stat">
      <div class="compact-stat-label">5 分钟负载</div>
      <div class="compact-stat-value" x-text="formatNumber(loadValue('5min'))"></div>
    </div>
    <div class="compact-stat">
      <div class="compact-stat-label">15 分钟负载</div>
      <div class="compact-stat-value" x-text="formatNumber(loadValue('15min'))"></div>
    </div>
  </div>

  <div class="detail-grid-wide">
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>总体利用率</h3></div>
      <div id="cpu-detail-gauge" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-8">
      <div class="chart-card-header"><h3>CPU 趋势</h3></div>
      <div id="cpu-detail-load" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-8">
      <div class="chart-card-header"><h3>各核心热力图</h3></div>
      <div id="cpu-detail-heatmap" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>CPU Top 进程</h3></div>
      <div id="cpu-detail-top" class="chart-box-md"></div>
    </div>
  </div>

  <div class="chart-card mt-4">
    <div class="chart-card-header"><h3>CPU 占用 TOP 10</h3></div>
    <table class="process-table">
      <thead><tr><th>PID</th><th>用户</th><th>进程</th><th>CPU%</th><th>内存%</th><th>操作</th></tr></thead>
      <tbody>
        <template x-for="p in topProcesses.by_cpu.slice(0, 10)" :key="p.pid">
          <tr>
            <td class="font-mono text-xs" x-text="p.pid"></td>
            <td x-text="p.user"></td>
            <td x-text="p.name || p.cmd"></td>
            <td :style="{color: statusColor(p.cpu_percent)}" x-text="p.cpu_percent.toFixed(1) + '%'"></td>
            <td x-text="p.mem_percent.toFixed(1) + '%'"></td>
            <td><button class="kill-btn" @click="killProcess(p.pid, p.user)">Kill</button></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
</template>

<template x-if="drillTarget === 'memory'">
<div class="detail-panel" x-transition>
  <div class="detail-header">
    <button class="back-btn" @click="backToOverview()">← 返回</button>
    <h2>内存详情</h2>
  </div>

  <div class="stat-strip">
    <div class="compact-stat">
      <div class="compact-stat-label">RAM 使用率</div>
      <div class="compact-stat-value" :style="{color: statusColor(memoryPercent())}" x-text="formatPercentM(memoryPercent())"></div>
    </div>
    <div class="compact-stat">
      <div class="compact-stat-label">RAM 已用</div>
      <div class="compact-stat-value" x-text="formatBytesM(memoryUsed())"></div>
    </div>
    <div class="compact-stat">
      <div class="compact-stat-label">可用内存</div>
      <div class="compact-stat-value" x-text="formatBytesM(memoryAvailable())"></div>
    </div>
    <div class="compact-stat">
      <div class="compact-stat-label">Swap 使用率</div>
      <div class="compact-stat-value" :style="{color: statusColor(swapPercent())}" x-text="formatPercentM(swapPercent())"></div>
    </div>
  </div>

  <div class="detail-grid-wide">
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>RAM 仪表盘</h3></div>
      <div id="mem-detail-gauge" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>内存结构</h3></div>
      <div id="mem-detail-ring" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>Swap 仪表盘</h3></div>
      <div id="mem-detail-swap" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-8">
      <div class="chart-card-header"><h3>内存趋势</h3></div>
      <div id="mem-detail-trend" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>内存 Top 进程</h3></div>
      <div id="mem-detail-top" class="chart-box-md"></div>
    </div>
  </div>

  <div class="chart-card mt-4">
    <div class="chart-card-header"><h3>内存占用 TOP 10</h3></div>
    <table class="process-table">
      <thead><tr><th>PID</th><th>用户</th><th>进程</th><th>内存%</th><th>RSS</th><th>操作</th></tr></thead>
      <tbody>
        <template x-for="p in topProcesses.by_mem.slice(0, 10)" :key="p.pid">
          <tr>
            <td class="font-mono text-xs" x-text="p.pid"></td>
            <td x-text="p.user"></td>
            <td x-text="p.name || p.cmd"></td>
            <td :style="{color: statusColor(p.mem_percent)}" x-text="p.mem_percent.toFixed(1) + '%'"></td>
            <td class="font-mono" x-text="p.rss ? formatBytesM(p.rss) : '-'"></td>
            <td><button class="kill-btn" @click="killProcess(p.pid, p.user)">Kill</button></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
</template>

<template x-if="drillTarget === 'disk'">
<div class="detail-panel" x-transition>
  <div class="detail-header">
    <button class="back-btn" @click="backToOverview()">← 返回</button>
    <h2>磁盘详情</h2>
  </div>

  <div class="detail-grid-wide">
    <div class="chart-card detail-span-6">
      <div class="chart-card-header"><h3>挂载点使用率</h3></div>
      <div id="disk-detail-usage" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-6">
      <div class="chart-card-header"><h3>inode 使用率</h3></div>
      <div id="disk-detail-inode" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-8">
      <div class="chart-card-header"><h3>磁盘 I/O 速率</h3></div>
      <div id="disk-detail-io" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>设备繁忙度</h3></div>
      <div id="disk-detail-device" class="chart-box-md"></div>
    </div>
  </div>

  <div class="chart-card mt-4">
    <div class="chart-card-header"><h3>分区使用情况</h3></div>
    <table class="process-table">
      <thead><tr><th>挂载点</th><th>设备</th><th>总量</th><th>已用</th><th>可用</th><th>使用率</th></tr></thead>
      <tbody>
        <template x-for="d in topDisks(12)" :key="d.mountpoint">
          <tr>
            <td class="font-mono" x-text="d.mountpoint"></td>
            <td class="text-xs text-muted" x-text="d.device"></td>
            <td x-text="formatBytesM(d.total)"></td>
            <td x-text="formatBytesM(d.used)"></td>
            <td x-text="formatBytesM(d.free || (d.total - d.used))"></td>
            <td :style="{color: statusColor(d.percent)}" x-text="formatPercentM(d.percent)"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
</template>

<template x-if="drillTarget === 'network'">
<div class="detail-panel" x-transition>
  <div class="detail-header">
    <button class="back-btn" @click="backToOverview()">← 返回</button>
    <h2>网络详情</h2>
  </div>

  <div class="stat-strip">
    <div class="compact-stat">
      <div class="compact-stat-label">下行速率</div>
      <div class="compact-stat-value" style="color:#38bdf8" x-text="formatRate(netIn())"></div>
    </div>
    <div class="compact-stat">
      <div class="compact-stat-label">上行速率</div>
      <div class="compact-stat-value" style="color:#4ade80" x-text="formatRate(netOut())"></div>
    </div>
    <div class="compact-stat">
      <div class="compact-stat-label">TCP 连接</div>
      <div class="compact-stat-value" x-text="network.tcp_total || 0"></div>
    </div>
    <div class="compact-stat">
      <div class="compact-stat-label">丢包总计</div>
      <div class="compact-stat-value" x-text="(network.totals?.drop_in || 0) + (network.totals?.drop_out || 0)"></div>
    </div>
  </div>

  <div class="detail-grid-wide">
    <div class="chart-card detail-span-8">
      <div class="chart-card-header"><h3>吞吐趋势</h3></div>
      <div id="network-detail-throughput" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>TCP 状态分布</h3></div>
      <div id="tcp-detail-pie" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-6">
      <div class="chart-card-header"><h3>报文速率</h3></div>
      <div id="network-detail-packets" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-6">
      <div class="chart-card-header"><h3>错误与丢包</h3></div>
      <div id="network-detail-events" class="chart-box-md"></div>
    </div>
  </div>
</div>
</template>

<template x-if="drillTarget === 'gpu'">
<div class="detail-panel" x-transition>
  <div class="detail-header">
    <button class="back-btn" @click="backToOverview()">← 返回</button>
    <h2>GPU 详情</h2>
    <span class="text-xs text-muted" x-text="gpu.name || '未检测到 GPU'"></span>
  </div>

  <div class="stat-strip">
    <div class="compact-stat">
      <div class="compact-stat-label">利用率</div>
      <div class="compact-stat-value" :style="{color: statusColor(gpu.util || 0)}" x-text="formatPercentM(gpu.util || 0)"></div>
    </div>
    <div class="compact-stat">
      <div class="compact-stat-label">显存已用</div>
      <div class="compact-stat-value" x-text="gpu.mem_used ? (gpu.mem_used + ' MB') : '-'"></div>
    </div>
    <div class="compact-stat">
      <div class="compact-stat-label">显存总量</div>
      <div class="compact-stat-value" x-text="gpu.mem_total ? (gpu.mem_total + ' MB') : '-'"></div>
    </div>
    <div class="compact-stat">
      <div class="compact-stat-label">温度</div>
      <div class="compact-stat-value" :style="{color: gpuTempColor()}" x-text="gpu.temp ? (gpu.temp + ' C') : '-'"></div>
    </div>
  </div>

  <div class="detail-grid-wide">
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>利用率仪表盘</h3></div>
      <div id="gpu-detail-gauge" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>显存结构</h3></div>
      <div id="gpu-detail-mem" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>温度与显存趋势</h3></div>
      <div id="gpu-detail-temp" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-12">
      <div class="chart-card-header"><h3>GPU 进程显存占用</h3></div>
      <div id="gpu-detail-top" class="chart-box-sm"></div>
    </div>
  </div>

  <div class="chart-card mt-4">
    <div class="chart-card-header"><h3>GPU 进程</h3></div>
    <table class="process-table">
      <thead><tr><th>PID</th><th>用户</th><th>进程</th><th>显存</th></tr></thead>
      <tbody>
        <template x-for="p in gpu.processes" :key="p.pid">
          <tr>
            <td class="font-mono text-xs" x-text="p.pid"></td>
            <td x-text="p.user || '-'"></td>
            <td x-text="p.name || '-'"></td>
            <td class="font-mono" x-text="(p.gpu_memory_usage || p.used_memory || 0) + ' MB'"></td>
          </tr>
        </template>
        <template x-if="gpu.processes.length === 0">
          <tr><td colspan="4" class="text-xs text-muted" style="text-align:center;padding:16px">无 GPU 进程</td></tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
</template>

<template x-if="drillTarget === 'docker'">
<div class="detail-panel" x-transition>
  <div class="detail-header">
    <button class="back-btn" @click="backToOverview()">← 返回</button>
    <h2>Docker 容器</h2>
    <span class="badge badge-info" x-text="docker.total_running + '/' + docker.total_containers + ' 运行中'"></span>
    <a href="/docker" class="btn btn-sm" style="margin-left:auto">完整管理</a>
  </div>

  <div class="detail-grid-wide">
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>容器状态分布</h3></div>
      <div id="docker-detail-status" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-8">
      <div class="chart-card-header"><h3>容器组资源占用</h3></div>
      <div id="docker-detail-groups" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-6">
      <div class="chart-card-header"><h3>容器 CPU Top</h3></div>
      <div id="docker-detail-cpu" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-6">
      <div class="chart-card-header"><h3>重启次数排行</h3></div>
      <div id="docker-detail-restarts" class="chart-box-md"></div>
    </div>
  </div>

  <div class="chart-card mt-4">
    <div class="chart-card-header"><h3>容器列表</h3></div>
    <table class="process-table">
      <thead><tr><th>容器名</th><th>镜像</th><th>状态</th><th>CPU%</th><th>内存%</th><th>端口</th></tr></thead>
      <tbody>
        <template x-for="c in docker.containers" :key="c.name">
          <tr>
            <td class="font-mono" x-text="c.name"></td>
            <td class="text-xs text-muted" x-text="c.image || '-'"></td>
            <td>
              <span class="badge"
                    :class="c.state === 'running' ? 'badge-ok' : c.state === 'restarting' ? 'badge-crit' : 'badge-idle'"
                    x-text="c.state || 'unknown'"></span>
            </td>
            <td x-text="formatPercentM(c.cpu_percent || 0)"></td>
            <td x-text="formatPercentM(c.mem_percent || 0)"></td>
            <td class="text-xs font-mono" x-text="c.ports || '-'"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
</template>

<template x-if="drillTarget === 'system'">
<div class="detail-panel" x-transition>
  <div class="detail-header">
    <button class="back-btn" @click="backToOverview()">← 返回</button>
    <h2>系统信息</h2>
  </div>

  <div class="detail-grid-wide">
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>主机信息</h3></div>
      <div class="info-table">
        <div class="info-row"><span>主机名</span><span x-text="systemInfo.hostname || '-'"></span></div>
        <div class="info-row"><span>系统</span><span x-text="systemInfo.os || '-'"></span></div>
        <div class="info-row"><span>内核</span><span x-text="systemInfo.kernel || '-'"></span></div>
        <div class="info-row"><span>CPU</span><span x-text="systemInfo.cpu_model || '-'"></span></div>
        <div class="info-row"><span>逻辑核心</span><span x-text="cpu.count + ' 核'"></span></div>
        <div class="info-row"><span>运行时间</span><span x-text="uptime || '-'"></span></div>
      </div>
    </div>
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>资源占比</h3></div>
      <div id="system-detail-resource" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-4">
      <div class="chart-card-header"><h3>告警结构</h3></div>
      <div id="system-detail-alerts" class="chart-box-md"></div>
    </div>
    <div class="chart-card detail-span-12">
      <div class="chart-card-header"><h3>存储布局</h3></div>
      <div id="system-detail-storage" class="chart-box-md"></div>
    </div>
  </div>
</div>
</template>

<template x-if="locateTarget">
<div class="modal-overlay" @click.self="closeLocate()" x-transition.opacity>
  <div class="modal-content">
    <template x-if="locateTarget.type === 'processes'">
      <div>
        <div class="modal-header">
          <h3>进程排行
            <span class="text-xs text-muted" style="margin-left:8px">
              按
              <button class="btn btn-xs" :class="locateTarget.sort === 'cpu' ? 'btn-primary' : ''" @click="locateTarget.sort='cpu'; _loadProcesses()">CPU</button>
              <button class="btn btn-xs" :class="locateTarget.sort === 'mem' ? 'btn-primary' : ''" @click="locateTarget.sort='mem'; _loadProcesses()">内存</button>
            </span>
          </h3>
          <button class="modal-close" @click="closeLocate()">x</button>
        </div>
        <table class="process-table">
          <thead><tr><th>PID</th><th>用户</th><th>进程</th><th>CPU%</th><th>内存%</th><th>操作</th></tr></thead>
          <tbody>
            <template x-for="p in (locateTarget.sort === 'mem' ? topProcesses.by_mem : topProcesses.by_cpu).slice(0, 20)" :key="p.pid">
              <tr>
                <td class="font-mono text-xs" x-text="p.pid"></td>
                <td x-text="p.user"></td>
                <td x-text="p.name || p.cmd"></td>
                <td :style="{color: statusColor(p.cpu_percent)}" x-text="p.cpu_percent.toFixed(1) + '%'"></td>
                <td x-text="p.mem_percent.toFixed(1) + '%'"></td>
                <td><button class="kill-btn" @click="killProcess(p.pid, p.user)">Kill</button></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>

    <template x-if="locateTarget.type === 'alerts'">
      <div>
        <div class="modal-header">
          <h3>告警历史</h3>
          <button class="modal-close" @click="closeLocate()">x</button>
        </div>
        <div class="alert-bar" style="margin-bottom:12px">
          <span class="alert-badge alert-badge-critical" x-text="'严重 ' + alerts.critical"></span>
          <span class="alert-badge alert-badge-warning" x-text="'警告 ' + alerts.warning"></span>
          <span class="alert-badge alert-badge-ok" x-text="'信息 ' + alerts.info"></span>
        </div>
        <ul class="alert-timeline">
          <template x-for="(a, idx) in alerts.recent" :key="idx">
            <li>
              <span class="alert-time" x-text="formatAlertTime(a)"></span>
              <span class="alert-severity"
                    :class="a.severity === 'critical' ? 'alert-badge-critical' : a.severity === 'warning' ? 'alert-badge-warning' : 'alert-badge-ok'"
                    x-text="a.severity || 'info'"></span>
              <span class="alert-msg" x-text="a.message || a.msg || '-'"></span>
            </li>
          </template>
          <template x-if="alerts.recent.length === 0">
            <li class="text-muted text-xs" style="padding:20px;text-align:center">暂无告警记录</li>
          </template>
        </ul>
      </div>
    </template>
  </div>
</div>
</template>

</div>
{% endblock %}
