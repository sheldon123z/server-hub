id: change-planner
name: Change Planner
version: 0.1.0
summary: 面向服务重启、配置变更和维护窗口的变更规划技能。
triggers:
  keywords: ["重启", "变更", "升级", "发布", "切换", "维护窗口"]
  page_contexts: ["services", "docker", "cron"]
capabilities: ["change-planning", "risk-assessment"]
required_tools: ["service_control", "docker_container_action", "playbook_create"]
allowed_roles: ["admin"]
entrypoints:
  type: prompt
